# Charleston happy hours - HAND-CURATED, and that is deliberate.
#
# A happy hour is not a calendar event. It is a standing weekly attribute of a
# venue, and essentially nobody publishes it in a machine-readable way: a
# city-wide search of the local events API for "happy hour" across eight days
# matched exactly ONE venue. So this file is maintained by hand.
#
# THE DAYS PROBLEM, AND HOW IT WAS SOLVED. The big aggregators publish the time
# window and the deals but NOT the day of the week - zero of 89 venues on the
# largest list state their days. The way in: charlestonguru.com indexes the
# same venues by day at /charleston-happy-hours/{monday..sunday}/, so ABSENCE
# from a day page is real negative evidence. That is how Prohibition and Uptown
# Social were established as genuinely stopping at Thursday rather than the
# lazy "Mon-Fri" every summary assumes.
#
# Each row was cross-checked by a second pass that re-fetched sources
# independently. `checked` is when that happened. Bars change hours without
# telling anyone, so re-verify before the start of each semester.
#
# It ships INSIDE the app, because it is public information about public
# businesses - every friend gets it with no setup, and a refreshed list arrives
# through the normal app update. Anyone can override or add a venue in their
# own calendar/happy_hours.toml, which wins on name.
#
# LEAVE days = "unknown" IF YOU DO NOT KNOW. An unconfirmed entry is still
# listed, but is never shown as "on today" - sending someone across town to a
# happy hour that does not exist is the failure this file exists to prevent.

# ---------------------------------------------------------------- Upper King

[[venue]]
name = "Prohibition"
url = "https://www.prohibitioncharleston.com/"
address = "547 King St"
category = "both"
days = "Mon-Thu"
start = "4:00 PM"
end = "6:00 PM"
deals = "Bar only. $7 Aperol spritz, Moscow mule, Brown Derby, draft beer, red/white wine. Snacks $6-$10."
source = "prohibitioncharleston.com (own site) + charlestonguru day pages"
checked = "2026-08-31"
note = "Strongest record on the list: the venue's own site states Mon-Thu, and it is absent from the Fri/Sat/Sun day pages. Ends at 6, the earliest here, so it is easy to miss. Doors open 4pm Mon-Wed, so it starts the moment they open."

